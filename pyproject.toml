[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hllm-pipeline"
version = "0.1.0"
description = "Pipeline for generating CVRP heuristics with LLMs"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.61.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = []

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "scripts"]
extraPaths = ["src"]
